spring:
  application:
    name: test-spring-rest-normal

  datasource:
    url: jdbc:postgresql://localhost:5432/genesis_test?currentSchema=public
    username: postgres
    password: psql
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false



server:
  port: 8086
  servlet:
    context-path: /test-spring-rest-normal

# Logs Configuration
logging:
  level:
    root: TRACE
    org.hibernate.SQL: TRACE





app:
  config:
    column-visibility:
      file: ${user.dir}/config/column-visibility.json
